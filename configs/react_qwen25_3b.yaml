# 프롬프트 강건성 점검(ReAct 원 ALFWorld 예시, 형식 A). main_3b.yaml과 같은 정책(Qwen2.5-3B, 후보 점수화, 탐욕, 30 step)에 프롬프트만 다름
# 계획: docs/prompt_robustness_plan_2026-10-17.md. 사용: python collect/rollout.py --config configs/react_qwen25_3b.yaml --game_list results/games_main3b_first250.json --repeats 1
model_name: Qwen/Qwen2.5-3B-Instruct
dtype: bfloat16
device: cuda
policy: score                             # admissible 후보 로그확률로 선택 (constrained action selection)
score_norm: sum
max_new_tokens: 48                        # policy=generate일 때만 사용
num_episodes: 250
max_steps: 30
temperature: 0.0
relative_layers: [0.25, 0.5, 0.75, 1.0]
alfworld_config: configs/alfworld_base.yaml
split: train
out_dir: data/react_qwen25_3b
seed: 0
prompt_style: react                       # ReAct 원 예시, chat template 없는 completion(형식 A)
react_prompts: prompts/react/alfworld_3prompts.json
cand_batch: 16                            # 프롬프트가 v2의 2~3배라 후보를 16개씩 계산(메모리)
