# 새 episode 1,000개 수집(docs/collect_ext1000_plan_2026-10-21.md, 2026-10-21 승인). main_3b.yaml과 같은 설정이고
# out_dir, game_list, repeats, num_episodes만 다르다(게임은 collect/make_new_game_list.py로 main_3b와 겹치지 않게 뽑음).
# 사용: python collect/rollout.py --config configs/ext1000_3b.yaml [--resume]
model_name: Qwen/Qwen2.5-3B-Instruct
dtype: bfloat16
device: cuda
policy: score                             # admissible 후보 로그확률로 선택 (constrained action selection)
score_norm: sum
max_new_tokens: 48                        # policy=generate일 때만 사용
num_episodes: 0                           # game_list x repeats로 덮어쓴다
max_steps: 30
temperature: 0.0
relative_layers: [0.25, 0.5, 0.75, 1.0]
alfworld_config: configs/alfworld_base.yaml
split: train
out_dir: data/ext1000_3b
seed: 0
game_list: data/ext1000_3b/games.json
repeats: 1
